<svg xmlns="http://www.w3.org/2000/svg" data-mirror="true" width="2000" height="1000" viewBox="0 0 2000 1000">
  <!--
    Strata · 2–4 teams. Three shelves stacked on columns, with holes to drop grenades through
    and a hill on the top one. The lowest shelf hangs over the sea.
    Black is air, brown is soil, grey-blue is stone (water is the bottom 20 px). Only the left
    half is drawn (#half); it is mirrored onto the right so both sides play the same
    (data-mirror: the build copies the left half over exactly, pixel for pixel).
    Run `npm run maps` after editing to rebuild the PNG.
  -->
  <defs>
    <!-- Bends plain shapes into rounded, natural-looking rock. -->
    <filter id="rock" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2400" height="1400" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.007" numOctaves="2" seed="37" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="50" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="8"/>
      <feComponentTransfer><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
    </filter>
    <clipPath id="left-half"><rect x="-100" y="-100" width="1100" height="1200"/></clipPath>

    <g id="half">
      <g filter="url(#rock)" fill="#b5794a">
        <!-- top shelf: a hill on the left part, a gap to drop through, the middle part -->
        <path d="M170 365 C165 330 200 312 245 308 C300 300 345 255 400 250 C455 246 505 290 560 298 C600 303 630 300 655 312
                 C665 335 660 365 640 380 C580 392 520 380 460 388 C400 396 330 380 270 392 C220 400 175 395 170 365 Z"/>
        <path d="M705 312 C740 298 800 300 860 292 C920 285 950 250 1000 240 L1100 240 L1100 385 L1000 385 C940 392 880 380 820 390
                 C770 396 720 388 705 365 C698 345 698 325 705 312 Z"/>
        <!-- middle shelf: open in the middle, a gap near the outer end -->
        <path d="M60 600 C55 570 80 555 120 552 C180 548 240 556 300 552 C312 570 310 600 300 622 C240 632 180 628 120 634
                 C85 636 62 625 60 600 Z"/>
        <path d="M345 550 C420 540 500 556 580 545 C660 535 740 548 820 545 C860 545 885 565 885 590 C885 612 860 625 820 624
                 C740 630 660 620 580 632 C500 640 420 625 350 630 C335 610 335 570 345 550 Z"/>
        <!-- bottom shelf, joined in the middle, hanging over the sea at its outer end -->
        <path d="M230 840 C225 810 260 795 300 795 C400 792 500 800 600 790 C680 784 740 792 780 800 C792 820 790 850 778 868
                 C700 876 620 866 540 874 C460 880 380 868 300 876 C260 878 233 865 230 840 Z"/>
        <path d="M825 800 C880 790 940 795 1000 790 L1100 790 L1100 870 L1000 870 C940 876 880 868 830 872 C815 850 815 820 825 800 Z"/>
        <!-- columns between the shelves, and pillars standing in the sea -->
        <path d="M222 560 C246 500 246 440 225 380 L292 380 C268 440 268 500 292 560 Z"/>
        <path d="M418 805 C442 740 442 680 418 622 L486 622 C462 680 462 740 486 805 Z"/>
        <path d="M598 865 C612 950 605 1020 595 1100 L652 1100 C640 1020 635 950 648 865 Z"/>
        <path d="M955 865 C975 950 970 1030 955 1100 L1100 1100 L1100 865 Z"/>
        <!-- drips under the shelves -->
        <circle cx="330" cy="395" r="15"/><circle cx="560" cy="390" r="16"/><circle cx="860" cy="392" r="14"/>
        <circle cx="160" cy="638" r="15"/><circle cx="540" cy="640" r="16"/><circle cx="760" cy="632" r="14"/>
        <circle cx="380" cy="880" r="15"/><circle cx="720" cy="875" r="14"/>
        <!-- floating rocks over the top shelf -->
        <ellipse cx="330" cy="140" rx="60" ry="22"/>
        <ellipse cx="760" cy="160" rx="55" ry="20"/>
      </g>
    </g>
  </defs>

  <use href="#half" clip-path="url(#left-half)"/>
  <use href="#half" clip-path="url(#left-half)" transform="matrix(-1 0 0 1 2000 0)"/>
</svg>
